name: Build & Deploy

on:
  push:
    branches: [ main ]
  schedule:
    # 7h UTC ≈ 9h heure de Paris (8h en hiver) : les résultats FDJ de la veille
    # ne sont pas toujours disponibles dès 5h, d'où le décalage vs 3h UTC avant.
    - cron: "0 7 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r data-pipeline/requirements-dev.txt

      - name: Test pipeline
        run: |
          cd data-pipeline
          pytest -q

      - name: Generate data
        run: |
          cd data-pipeline
          python generate_data.py
          python generate_archives.py

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install
        run: |
          cd frontend
          npm install

      - name: Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
